<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Left Tile Mini (CPU) -->
  <rect x="10" y="12" width="20" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="14" y="16" width="12" height="12" rx="2" fill="url(#cyanGrad)"/>
  <rect x="14" y="32" width="12" height="3" rx="1.5" fill="#38bdf8"/>

  <!-- Right Tile Mini (RAM) -->
  <rect x="34" y="12" width="20" height="28" rx="5" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="38" y="16" width="12" height="12" rx="2" fill="url(#purpleGrad)"/>
  <rect x="38" y="32" width="12" height="3" rx="1.5" fill="#c084fc"/>

  <!-- Pulse/Wave Line below -->
  <path d="M 12 50 L 22 50 L 27 45 L 34 53 L 41 46 L 46 50 L 52 50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
